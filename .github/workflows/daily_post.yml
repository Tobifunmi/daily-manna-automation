name: Daily Manna Auto Post

on:
  schedule:
    # 10:00 UTC = 1:00 PM Bahrain time (UTC+3, no daylight saving)
    - cron: "0 10 * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the GitHub Actions tab, for testing

permissions:
  contents: write

jobs:
  post-daily-manna:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run full daily pipeline
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_daily_pipeline.py
